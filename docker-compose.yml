services:
  db:
    image: postgres:15-alpine
    container_name: real_estate_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: real_estate_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/real_estate_db
      - DEV_COMPANY_ID=1
      - INVITATION_DELIVERY_BACKEND=smtp
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM_EMAIL=invites@local.real-estate-ai.test
      - INVITATION_ACCEPT_BASE_URL=http://localhost:3000/invitations/accept
      - PASSWORD_RESET_URL=http://localhost:3000/reset-password
    depends_on:
      - db
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.21.7
    container_name: real_estate_mailpit
    restart: always
    ports:
      - "8025:8025"

volumes:
  postgres_data:
