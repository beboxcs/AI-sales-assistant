name: CI

on:
  push:

  pull_request:
    branches:
      - main

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt

  docker-ci:
    name: Docker Tests and Runtime Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker compose build web

      - name: Start PostgreSQL and Redis
        run: docker compose up -d db redis

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U postgres; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready in time."
          docker compose logs db
          exit 1

      - name: Wait for Redis
        shell: bash
        run: |
          for i in {1..30}; do
            if docker compose exec -T redis redis-cli ping; then
              echo "Redis is ready."
              exit 0
            fi

            echo "Waiting for Redis..."
            sleep 2
          done

          echo "Redis did not become ready in time."
          docker compose logs redis
          exit 1

      - name: Run database migrations
        run: docker compose run --rm web alembic upgrade head

      - name: Run tests inside Docker
        shell: bash
        run: |
          set +e
          docker compose run --rm -e B29_TEST_REDIS_URL=redis://redis:6379/15 web python -m pytest
          code=$?
          set -e

          if [ "$code" -eq 5 ]; then
            echo "No tests found yet - skipping test failure."
            exit 0
          fi

          exit "$code"

      - name: Start FastAPI
        run: docker compose up -d web

      - name: Show running containers
        run: docker compose ps

      - name: Wait for API liveness
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/v1/health; then
              echo "API liveness check passed."
              exit 0
            fi

            echo "Waiting for API liveness..."
            sleep 2
          done

          echo "API liveness check did not pass in time."
          docker compose logs web
          exit 1

      - name: Verify API readiness
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/v1/ready; then
              echo "API readiness check passed."
              exit 0
            fi

            echo "Waiting for API readiness..."
            sleep 2
          done

          echo "API readiness check did not pass in time."
          docker compose logs web
          docker compose logs db
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
